  <!-- Active Login Modal -->
  <div class="login-modal" id="login-modal">
    <button type="button" data-vq-action="close-modal" style="position: absolute; top: 20px; right: 25px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">✕</button>
    
    <div class="modal-box" style="max-height: 460px;">
      <h3 style="font-size: 26px; margin-bottom: 8px; font-weight: 900;">Welcome Back</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 22px;">Enter your credentials to access your secure account.</p>
      
      <div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
        <div>
          <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 700;">EMAIL ADDRESS</label>
          <input type="email" class="input-txt" id="login-email" placeholder="name@example.com">
        </div>

        <div>
          <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 700;">PASSWORD</label>
          <input type="password" class="input-txt" id="login-password" placeholder="••••••••">
        </div>

        <span id="login-error" style="color: #ff334b; font-size: 12px; display: none; font-weight: 600;"></span>
      </div>

      <div style="display: flex; gap: 12px; width: 100%; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color);">
        <button type="button" data-vq-action="close-modal" class="btn-connect" style="flex: 1; background: transparent; border: 1px solid var(--border-color); color: #fff; padding: 14px; border-radius: 12px; cursor: pointer;">Cancel</button>
        <button type="button" data-vq-action="open-login" class="btn-connect" style="flex: 1; background: var(--accent-coral); border: none; color: #fff; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 800;">Log In</button>
      </div>
    </div>
  </div>
