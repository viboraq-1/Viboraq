  <!-- Interactive Sub-Modal for Dashboard Feature Clicks -->
  <div class="sub-modal" id="sub-feature-modal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="sub-modal-title" style="font-size: 20px; font-weight: 900; color: #fff;">Feature Settings</h3>
        <button type="button" data-vq-action="close-modal" style="background: none; border: none; color: #fff; font-size: 22px; cursor: pointer;">✕</button>
      </div>
      <div id="sub-modal-body" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;"></div>
      <button type="button" class="btn-connect" data-vq-action="close-modal" style="background: var(--accent-coral); border: none; padding: 12px; font-weight: 800;">Close & Save</button>
    </div>
  </div>
